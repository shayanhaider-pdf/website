<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #111; padding: 20px; }
  .card { width: min(100%, 540px); background: #fff; border: 1px solid #ddd; border-radius: 22px; padding: 22px; box-shadow: 0 14px 40px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .sub { margin: 0 0 18px; color: #666; line-height: 1.4; }
  label { display: block; font-weight: 650; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 92px; resize: vertical; font: inherit; font-size: 18px; padding: 14px; border: 1px solid #ccc; border-radius: 14px; outline: none; }
  textarea:focus { border-color: #777; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
  .meta { display: flex; justify-content: space-between; gap: 12px; color: #777; font-size: 13px; margin-top: 8px; }
  .qrbox { margin: 22px auto 18px; width: min(100%, 360px); aspect-ratio: 1; display: grid; place-items: center; border: 1px solid #ddd; border-radius: 18px; background: #fff; padding: 14px; overflow: hidden; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button { flex: 1 1 160px; border: 0; border-radius: 13px; padding: 13px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  #download { background: #111; color: #fff; }
  #clear { background: #ececee; color: #111; }
  #status { margin: 14px 0 0; min-height: 20px; font-size: 14px; color: #555; }
  #status.error { color: #b42318; }
</style>
</head>
<body>
<main class="card">
  <h1>QR Code Generator</h1>
  <p class="sub">Type text below. The QR code updates instantly.</p>
  <label for="text">Text to encode</label>
  <textarea id="text" spellcheck="false" autocomplete="off">PROD-A1</textarea>
  <div class="meta"><span id="count">7 bytes</span><span>No data is sent anywhere</span></div>
  <div class="qrbox"><canvas id="qr" width="600" height="600"></canvas></div>
  <div class="buttons">
    <button id="download" type="button">Download PNG</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <p id="status">Ready</p>
</main>
<script>
(() => {
  'use strict';
  const DATA_CAPACITY_L = [0,17,32,53,78,106,134,154,192,230,271];
  const ALIGNMENT = [null, [], [6,18], [6,22], [6,26], [6,30], [6,34], [6,22,38], [6,24,42], [6,26,46], [6,28,50]];
  const RS_BLOCKS_L = [null,[[1,26,19]],[[1,44,34]],[[1,70,55]],[[1,100,80]],[[1,134,108]],[[2,86,68]],[[2,98,78]],[[2,121,97]],[[2,146,116]],[[2,86,68],[2,87,69]]];
  const EXP = new Array(512).fill(0), LOG = new Array(256).fill(0);
  let x = 1;
  for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  function gfMul(a,b){ if(a===0||b===0) return 0; return EXP[LOG[a]+LOG[b]]; }
  function rsGenerator(degree){ let poly=[1]; for(let i=0;i<degree;i++){ const next=new Array(poly.length+1).fill(0); for(let j=0;j<poly.length;j++){ next[j]^=poly[j]; next[j+1]^=gfMul(poly[j],EXP[i]); } poly=next; } return poly; }
  function rsRemainder(data,degree){ const gen=rsGenerator(degree), rem=new Array(degree).fill(0); for(const byte of data){ const factor=byte^rem[0]; rem.shift(); rem.push(0); for(let i=0;i<degree;i++) rem[i]^=gfMul(gen[i+1],factor); } return rem; }
  class BitBuffer { constructor(){this.bits=[];} put(value,length){for(let i=length-1;i>=0;i--) this.bits.push(((value>>>i)&1)!==0);} get length(){return this.bits.length;} toBytes(){const out=[]; for(let i=0;i<this.bits.length;i+=8){let v=0; for(let j=0;j<8;j++) v=(v<<1)|(this.bits[i+j]?1:0); out.push(v);} return out;} }
  function chooseVersion(byteLen){ for(let v=1;v<=10;v++) if(byteLen<=DATA_CAPACITY_L[v]) return v; throw new Error('Text is too long. Maximum is 271 UTF-8 bytes.'); }
  function expandedBlocks(version){ const out=[]; for(const [count,total,data] of RS_BLOCKS_L[version]) for(let i=0;i<count;i++) out.push({total,data}); return out; }
  function makeCodewords(bytes,version){ const blocks=expandedBlocks(version), dataCapacity=blocks.reduce((s,b)=>s+b.data,0), buf=new BitBuffer(); buf.put(4,4); buf.put(bytes.length,version<=9?8:16); for(const b of bytes) buf.put(b,8); const totalBits=dataCapacity*8; if(buf.length+4<=totalBits) buf.put(0,4); else if(buf.length<totalBits) buf.put(0,totalBits-buf.length); while(buf.length%8!==0) buf.put(0,1); const dataBytes=buf.toBytes(); let pad=0; while(dataBytes.length<dataCapacity) dataBytes.push((pad++%2===0)?0xEC:0x11); const dataBlocks=[],eccBlocks=[]; let offset=0; for(const b of blocks){ const d=dataBytes.slice(offset,offset+b.data); offset+=b.data; dataBlocks.push(d); eccBlocks.push(rsRemainder(d,b.total-b.data)); } const result=[], maxData=Math.max(...dataBlocks.map(b=>b.length)), maxEcc=Math.max(...eccBlocks.map(b=>b.length)); for(let i=0;i<maxData;i++) for(const b of dataBlocks) if(i<b.length) result.push(b[i]); for(let i=0;i<maxEcc;i++) for(const b of eccBlocks) if(i<b.length) result.push(b[i]); return result; }
  function bchDigit(v){let n=0; while(v!==0){n++;v>>>=1;} return n;}
  function bchTypeInfo(data){const G15=0x537,MASK=0x5412; let d=data<<10; while(bchDigit(d)-bchDigit(G15)>=0) d^=G15<<(bchDigit(d)-bchDigit(G15)); return ((data<<10)|d)^MASK;}
  function bchTypeNumber(data){const G18=0x1f25; let d=data<<12; while(bchDigit(d)-bchDigit(G18)>=0) d^=G18<<(bchDigit(d)-bchDigit(G18)); return (data<<12)|d;}
  function newMatrix(n){return Array.from({length:n},()=>Array(n).fill(null));}
  function setupFinder(m,row,col){const n=m.length; for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){const rr=row+r,cc=col+c; if(rr<0||rr>=n||cc<0||cc>=n) continue; const dark=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4); m[rr][cc]=dark;}}
  function setupAlignment(m,version){const pos=ALIGNMENT[version]; for(const row of pos) for(const col of pos){if(m[row][col]!==null) continue; for(let r=-2;r<=2;r++) for(let c=-2;c<=2;c++) m[row+r][col+c]=Math.max(Math.abs(r),Math.abs(c))!==1;}}
  function setupTiming(m){const n=m.length; for(let i=8;i<n-8;i++) if(m[i][6]===null) m[i][6]=(i%2===0); for(let i=8;i<n-8;i++) if(m[6][i]===null) m[6][i]=(i%2===0);}
  function setupVersionInfo(m,version){if(version<7)return; const bits=bchTypeNumber(version),n=m.length; for(let i=0;i<18;i++){const dark=((bits>>>i)&1)===1; m[Math.floor(i/3)][i%3+n-11]=dark; m[i%3+n-11][Math.floor(i/3)]=dark;}}
  function setupFormatInfo(m,mask){const bits=bchTypeInfo((1<<3)|mask),n=m.length; for(let i=0;i<15;i++){const dark=((bits>>>i)&1)===1; if(i<6)m[i][8]=dark; else if(i<8)m[i+1][8]=dark; else m[n-15+i][8]=dark;} for(let i=0;i<15;i++){const dark=((bits>>>i)&1)===1; if(i<8)m[8][n-i-1]=dark; else if(i<9)m[8][15-i]=dark; else m[8][15-i-1]=dark;} m[n-8][8]=true;}
  function maskBit(mask,r,c){switch(mask){case 0:return(r+c)%2===0;case 1:return r%2===0;case 2:return c%3===0;case 3:return(r+c)%3===0;case 4:return(Math.floor(r/2)+Math.floor(c/3))%2===0;case 5:return((r*c)%2+(r*c)%3)===0;case 6:return(((r*c)%2+(r*c)%3)%2)===0;case 7:return(((r*c)%3+(r+c)%2)%2)===0;default:return false;}}
  function mapData(m,codewords,mask){const n=m.length; let row=n-1,inc=-1,byteIndex=0,bitIndex=7; for(let col=n-1;col>0;col-=2){if(col===6)col--; while(true){for(let c=0;c<2;c++){const cc=col-c; if(m[row][cc]===null){let dark=false; if(byteIndex<codewords.length) dark=((codewords[byteIndex]>>>bitIndex)&1)===1; if(maskBit(mask,row,cc)) dark=!dark; m[row][cc]=dark; bitIndex--; if(bitIndex<0){byteIndex++;bitIndex=7;}}} row+=inc; if(row<0||row>=n){row-=inc;inc=-inc;break;}}}}
  function makeMatrix(text){const bytes=Array.from(new TextEncoder().encode(text)),version=chooseVersion(bytes.length),codewords=makeCodewords(bytes,version),n=17+4*version,m=newMatrix(n); setupFinder(m,0,0); setupFinder(m,n-7,0); setupFinder(m,0,n-7); setupAlignment(m,version); setupTiming(m); setupVersionInfo(m,version); const mask=0; setupFormatInfo(m,mask); mapData(m,codewords,mask); return{m,version,bytes:bytes.length};}
  function draw(text){const canvas=document.getElementById('qr'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),count=document.getElementById('count'); ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height); if(text.length===0){status.textContent='Type something to generate a QR code.';count.textContent='0 bytes';return;} try{const{m,version,bytes}=makeMatrix(text); count.textContent=bytes+(bytes===1?' byte':' bytes'); const quiet=4,modules=m.length+quiet*2,scale=Math.floor(canvas.width/modules),size=scale*modules,offset=Math.floor((canvas.width-size)/2); ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000'; for(let r=0;r<m.length;r++) for(let c=0;c<m.length;c++) if(m[r][c]) ctx.fillRect(offset+(c+quiet)*scale,offset+(r+quiet)*scale,scale,scale); status.textContent='Ready · QR version '+version+' · error correction L';status.className='';}catch(e){status.textContent=e.message;status.className='error';}}
  const input=document.getElementById('text'); const params=new URLSearchParams(location.search); if(params.has('text')) input.value=params.get('text'); input.addEventListener('input',()=>draw(input.value)); document.getElementById('clear').addEventListener('click',()=>{input.value='';draw('');input.focus();}); document.getElementById('download').addEventListener('click',()=>{if(!input.value)return; const a=document.createElement('a'),safe=(input.value.trim().slice(0,40).replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'qr-code'); a.download=safe+'.png';a.href=document.getElementById('qr').toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}); draw(input.value);
})();
</script>
</body>
</html>
